# Adapted from the Firebase CLI template (PayDay sibling).
# TODO(sterling): after `firebase init hosting:github`, replace MEND_PROJECT_ID
# and the FIREBASE_SERVICE_ACCOUNT_MEND secret name with the generated values.
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MEND }}
          channelId: live
          projectId: MEND_PROJECT_ID
  deploy_database_rules:
    # NOTE: needs the CI service account to hold the "Firebase Realtime Database
    # Admin" role — one-time grant in Cloud Console > IAM. Until then this job
    # fails when rules change.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check whether rules changed
        id: rules_changed
        run: |
          if git diff --quiet HEAD^ HEAD -- database.rules.json firebase.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.rules_changed.outputs.changed == 'true'
        with:
          node-version: 22
      - name: Deploy Realtime Database rules
        if: steps.rules_changed.outputs.changed == 'true'
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          npx firebase-tools@latest deploy --only database --project MEND_PROJECT_ID --non-interactive
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MEND }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
